name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.compiler }} / ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        compiler: [gcc, clang]
        build_type: [Debug, Release]
        threads: [OFF]
        include:
          # FFTW's own threading is opt-in, so it needs a build of its own.
          - os: ubuntu-24.04
            compiler: gcc
            build_type: Release
            threads: ON
          - os: macos-latest
            compiler: clang
            build_type: Release
            threads: OFF

    steps:
      - uses: actions/checkout@v5

      - name: Install FFTW (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfftw3-dev ninja-build

      - name: Install FFTW (macOS)
        if: runner.os == 'macOS'
        run: brew install fftw ninja

      - name: Select the compiler
        run: |
          if [ "${{ matrix.compiler }}" = "gcc" ]; then
            echo "CC=gcc-13" >> "$GITHUB_ENV"
            echo "CXX=g++-13" >> "$GITHUB_ENV"
          elif [ "${{ runner.os }}" = "macOS" ]; then
            echo "CC=clang" >> "$GITHUB_ENV"
            echo "CXX=clang++" >> "$GITHUB_ENV"
          else
            echo "CC=clang-18" >> "$GITHUB_ENV"
            echo "CXX=clang++-18" >> "$GITHUB_ENV"
          fi

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DFFTWPP_USE_FFTW_THREADS=${{ matrix.threads }}
          -DFFTWPP_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  package:
    name: install and find_package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install FFTW
        run: |
          sudo apt-get update
          sudo apt-get install -y libfftw3-dev ninja-build

      - name: Build and install
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}/prefix" \
            -DFFTWPP_BUILD_TESTS=OFF \
            -DFFTWPP_BUILD_EXAMPLES=OFF
          cmake --build build --parallel
          cmake --install build

      # The point of the install rules is that a separate project can consume
      # them, so consume them from a separate project.
      - name: Consume the installed package
        run: |
          cmake -S tests/package -B build-package -G Ninja \
            -DCMAKE_PREFIX_PATH="${GITHUB_WORKSPACE}/prefix"
          cmake --build build-package --parallel
          ctest --test-dir build-package --output-on-failure

  sanitizers:
    name: ${{ matrix.sanitizer }} sanitizer
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, thread]
    steps:
      - uses: actions/checkout@v5

      - name: Install FFTW
        run: |
          sudo apt-get update
          sudo apt-get install -y libfftw3-dev

      - name: Run the sanitized test suite
        run: ./scripts/test_sanitized.sh ${{ matrix.sanitizer }} -DFFTWPP_BUILD_EXAMPLES=OFF

  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Check formatting
        run: |
          find FFTWpp tests examples \( -name '*.h' -o -name '*.cpp' \) \
            | xargs clang-format --dry-run --Werror

  docs:
    name: doxygen
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfftw3-dev doxygen graphviz ninja-build
      - name: Build the documentation
        run: |
          cmake -S . -B build -G Ninja \
            -DFFTWPP_BUILD_DOCS=ON \
            -DFFTWPP_BUILD_TESTS=OFF \
            -DFFTWPP_BUILD_EXAMPLES=OFF
          cmake --build build --target doc
